services:
  # ==========================================
  # PostgreSQL Database + pgvector
  # ==========================================
  db:
    image: pgvector/pgvector:pg16
    container_name: cerebro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cerebro
      POSTGRES_PASSWORD: cerebro_secret_2024
      POSTGRES_DB: cerebro_operativo
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cerebro -d cerebro_operativo']
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Ollama - LLM Local (100% gratuito)
  # ==========================================
  ollama:
    image: ollama/ollama:latest
    container_name: cerebro-ollama
    restart: unless-stopped
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama

  # ==========================================
  # NestJS Backend
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cerebro-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: cerebro
      DB_PASSWORD: cerebro_secret_2024
      DB_NAME: cerebro_operativo
      JWT_SECRET: super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 24h
      PORT: 3000
      ALLOWED_EMAIL_DOMAIN: miempresa.com
      SEED_ADMIN_EMAIL: admin@miempresa.com
      SEED_ADMIN_PASSWORD: Admin123!
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: llama3.2
      OLLAMA_EMBED_MODEL: nomic-embed-text
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
